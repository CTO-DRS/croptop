# Memory budget (the emulator + IDE share this machine): Gradle 4 GB, Kotlin daemon 2 GB.
# Idle daemons exit after 30 min instead of the 3 h default, so stale daemons don't pile up.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon.idletimeout=1800000
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
