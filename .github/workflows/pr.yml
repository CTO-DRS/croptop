# PR checks, split per layer.
name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.1.0"
  ANDROID_NDK: "ndk;27.1.12297006"
  ANDROID_CMAKE: "cmake;3.22.1"

jobs:
  # 1. Kotlin contract: model + engine-api compile, unit + contract tests against engine-fake.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Contract & model tests
        run: ./gradlew :core:model:test :core:engine-api:testDebugUnitTest :core:engine-fake:testDebugUnitTest :core:input:testDebugUnitTest

  # 2. Android packaging: {fake, full} × {arm64-v8a, x86_64}. The ABI split keeps native builds per job.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [fake, full]
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
        with:
          native: ${{ matrix.flavor == 'full' }}
      - name: Assemble ${{ matrix.flavor }} (${{ matrix.abi }})
        run: ./gradlew :app:assemble${{ matrix.flavor == 'fake' && 'Fake' || 'Full' }}Debug -Pcroptop.abi=${{ matrix.abi }}
      - name: Verify APK ABI
        run: |
          apk=$(ls app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk)
          unzip -l "$apk" | grep -q "lib/${{ matrix.abi }}/" || { echo "missing lib/${{ matrix.abi }} in $apk"; exit 1; }
          if [ "${{ matrix.flavor }}" = full ]; then
            unzip -o -q "$apk" "lib/${{ matrix.abi }}/libcroptop.so" -d apk-libs
            bash core/engine/src/main/cpp/check_elf_alignment.sh "apk-libs/lib/${{ matrix.abi }}/libcroptop.so"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.abi }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk

  # 3. Native checks: host build, ctest, sanitizers, microbenchmarks.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          # Same directory as CROPTOP_NATIVE_BUILD_DIR below, so fetched deps and objects are reused.
          path: ${{ runner.temp }}/croptop-native-host
          key: native-${{ runner.os }}-${{ hashFiles('core/engine/src/main/cpp/cmake/**', 'core/engine/src/main/cpp/CMakeLists.txt') }}
      - name: Host native checks
        env:
          CROPTOP_NATIVE_BUILD_DIR: ${{ runner.temp }}/croptop-native-host
        run: bash core/engine/src/main/cpp/run_native_checks.sh

  # 4. Quality gates: formatting, lint (warnings = errors), screenshot tests.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Formatting
        run: ./gradlew spotlessCheck
      - name: Android Lint
        run: ./gradlew :app:lintFakeDebug
      - name: Screenshot tests (verify against committed snapshots)
        run: ./gradlew verifyRoborazziDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quality-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/outputs/roborazzi/**
            **/src/test/snapshots/*_compare.png

  # 5. Release evidence: commit, ABI, versions and checksums for every artifact.
  evidence:
    runs-on: ubuntu-latest
    needs: packaging
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Record evidence
        run: |
          {
            echo "commit: ${{ github.sha }}"
            echo "ref: ${{ github.ref }}"
            echo "built: $(date -u +%FT%TZ)"
            find artifacts -name '*.apk' -print0 | xargs -0 sha256sum
          } | tee build-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: build-evidence.txt
